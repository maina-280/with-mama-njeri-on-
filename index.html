<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mama Njeri's Kitchen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Header / Navigation -->
        <header>
            <div class="log image">
                <img src="image/logo.svg" alt="Mama Njeri's Kitchen Logo">
            <div class="logo">Mama Njeri's Kitchen</div>
            </div>
            <nav>
                <a href="#menu">Menu</a>
                <a href="#order">Order</a>
                <a href="#visit">Visit</a>
            </nav>
        </header>

        <!-- Hero Banner -->
        <div class="hero">
            <h1>Fresh Kenyan food, cooked daily</h1>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
             <!-- Left Side: Menu Table -->
            <div class="menu-section" id="menu">
                <h2>Menu (table)</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Dish</th>
                            <th>Price</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Pilau</td>
                            <td>KES 350</td>
                        </tr>
                        <tr>
                            <td>Ugali & Sukuma</td>
                            <td>KES 250</td>
                        </tr>
                        <tr>
                            <td>Chapati (2)</td>
                            <td>KES 100</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Right Side: Order Form -->
            <div class="order-section" id="order">
                <h2>Place an order (form)</h2>
                <form action="#" method="POST">
                    <label for="name">Your name</label>
                    <input type="text" id="name" name="name" placeholder="Enter your name" required>

                    <label for="dish">Select Dish</label>
                    <select id="dish" name="dish">
                        <option value="pilau">Pilau</option>
                        <option value="ugali-sukuma">Ugali & Sukuma</option>
                        <option value="chapati">Chapati (2)</option>
                    </select>

                    <button type="submit">Send order</button>
                </form>
            </div>
        </div>
        <!-- Bottom Grid Placeholders -->
        <div class="bottom-grid">
            
            <!-- Gallery Box 1 -->
            <div class="grid-box">
                <img src="image/chapati.svg" alt="Gallery photo 1">
                <img src="image/pilau.svg" alt="Gallery photo 2">
                <img src="image/ugali.svg" alt="Gallery photo 3">
            </div>

            <!-- Visit / Contact Box -->
            <div class="grid-box" id="visit">
                Opening hours and contact (div)
            </div>

        </div>
    </div>

</body>
</html>
